body:
  text: 餓鬼事經歸命彼世尊應供等正覺者第一蛇品一福田鬼事一阿羅漢如田施主如農夫施物如種子依彼而生果二為餓鬼施主其成田種子餓鬼得享受施主依福而增長三此世為善業供養於餓鬼為諸善業者彼得到天界二豚鬼事一汝體是金色照耀輝十方汝之口如豚前世為何業二令制此身業不制此口業是故那羅陀如汝之所見我如此之姿三是故那羅陀我今實告汝汝見是此姿勿為口惡業勿為如豚口三臭口鬼事一汝如神之美姿飄浮虛空中然尸蟲食汝惡臭口前世為何業二我修惡業者口中出惡語以聖者之姿態卻不制口業依前之修業我得此美姿以口作兩舌是以被腐蝕三告汝那羅陀此由汝所不見深懷慈悲者善人應勸言勿為兩舌語勿作妄語言汝將得為惠藥叉四人形鬼事一但得有機會無貪為布施前世為餓鬼今作地居神二護國四天王名高稱四洲俱吠羅持國廣目增長天彼等堪供養施者有果報三勿泣勿悲傷其餘所嘆息彼鬼有何益如是利彼親四然施物施僧團供彼僧伽之使用長為彼利益善作利彼事五戶外鬼事一彼等住家外街頭四處立自向舊家行便立於門口二依於過去業多獲飲食物供養軟硬食彼是世因緣誰會憶彼等三茲有慈悲人以時有因緣清淨且殊勝適時與飲食與汝等食物願汝得幸福四彼等集此處餓鬼集有因多得飲食物心非常歡喜五餓鬼等言我等受此食與我有因緣彼皆得長生為我行供養施主得善果六此實死世界無耕無畜牧亦無如商賈及錢作買賣七由此處所受得生死界之餓鬼如水高向低流此處實如是此處之所施利益諸餓鬼八川湧流滿海此處實如是此處之所施利益諸餓鬼九施我為善業彼等與我有因緣願友願親里憶起過去業施物與餓鬼一勿泣勿悲傷其餘所嘆息親亡有何益如是利彼親一一然施物施僧團供彼僧伽之使用常為死者益善為彼得利一二此處之所記於此親朋者所作之義務供養諸餓鬼僧伽處施力汝甚得福不少六食兒鬼事一一裸體之醜姿放惡臭呼出腐蝕氣蠅子來群集汝今立此處我問汝是誰二尊者我為女餓鬼行往惡趣道住此閻魔界多行惡業故趣此餓鬼界三晝生有五子夜又生五兒生子即為食我猶不飽足四我心飢中燒暗中難飲食不幸生惡趣見我受災厄五汝之身口意如何造惡業緣何業報果令汝食子肉六夫之妾妊娠我即抱敵意懷諸惡意行使彼兒流産七彼女二月胎胎兒塗血出彼女母怒我集合諸親戚八對我施詛咒且責我行惡我恐被咒詛故作妄語言九並兼為詛咒我食兒之肉又因妄語業兒身膿血滴由此業果報故食我子肉七食兒鬼事二一裸體之醜姿放惡臭呼出腐蝕氣蠅子來群集汝今立此處我問汝為誰二尊者我為女餓鬼往生惡趣道住此閻魔界趣此餓鬼界三晝生有七子夜又生七兒生子即為食我猶不飽足四我心飢中燒暗中難寂靜瞋心燃怒火為激情所驅五汝之身口意如何造惡業緣何業報果令汝食子肉六我有二兒子成熟為青年我子生而愚為夫所輕蔑七是故夫怒我帶來他妻妾彼女懷胎兒我乃生敵意八我以惡意行流産其胎兒彼女三月胎腐敗塗血出九彼女母怒我集合諸親戚對我施詛咒且責我行惡我恐被詛咒故作妄語言一若我不犯此我不食子肉緣於妄語業而生此業果兒身膿血滴食子之血肉八牛鬼事一取割緑草如狂者口中云食食汝何為此語對此死老牛二雖與飲食物死牛無復生汝何癡又愚他事亦如是三汝觀此牛體頭尾與四足若眼如生時此牛必得起四未見我祖父手足及頭體唯望其墓土即哭泣涕生猶如對死牛汝何此愚蠢五如火注酥油實為苦所燒如以水注火一切苦全消六汝知我懸心拔取煩惱矢汝去我惱苦失父之煩惱七除去煩惱矢我心得寂靜如無煩惱苦我子而今聞汝言我已無悲泣八智慧同情者以如是行之由悲得離脫若如善生父九織女鬼事一彼女食膿血且食排泄物此為何業果常時食膿血如此之婦人曾為如何業二美好又柔軟新衣被麗毛施與此婦人皆如銅板失如此之婦人曾為如何業三尊者此人是我妻慳食深嫉妒當我之施與沙門婆羅門罵我且責備四膿血排泄物不淨汝永食汝今於此世應衣銅板服為此不善業永遠來此世以食不淨物一禿頭鬼事一汝住宮殿中為何不外出汝本是何人幸福者出來我等欲見汝二裸體行外出我恥且為難我只被毛髮福業幾無作三我與汝外衣取此而著之幸福之人汝可來外面我等欲見汝四貴君所施與此物我無益此有佛弟子信深優婆塞五為我獻布施我可著此衣彼使我幸福達成此快樂六此等衆商人使彼女入浴塗香並著衣為彼獻布施七無間捧獻果衣服與飲食得成布施果八於此彼女美身著清淨衣上衣迦尸絹微笑出宮殿此為布施果彼女作此言九滿足心喜悅輝耀汝宮殿問汝如神者何業得此果一正行一比丘我以清淨心供奉油果子一一依此善業果我得住宮殿長久得享受今此時已短一二自今四月後期限已來臨我恐生地獄非常之苦極一三四角有四窗諸屋皆相似鐵壁圍四周頂柵以鐵覆一四鐵地用火燒四側百由旬充滿烈火焰每時皆此狀一五此處長期間我為惡業果不得不受苦是故我悲嘆一一象鬼事一先者乘白象彼人為先行中央牽騾馬車乘而驅去更後一處女乘轎耀十方二汝等持棍棒面泣身割破汝等人似鬼為如何惡業相互而吸血三先者乘白象為我最長子彼多為布施而受此幸福四中央四騾馬車乘速行者中有我兒子彼素無貪行而為布施主以此彼光輝五最後乘轎去年青之婦人賢明眼優美彼為我幼女享受多幸福六彼等於前世沙門婆羅門誠心行布施我等為慳貪罵沙門婆羅門彼等喜布施我等如蘆草刈割成凋落七汝等何食物以何為寢具如何而生活相互為傷害有限多財寶而無幸福無本今日受痛苦八我等相互害吸食膿與血多吸無滿足亦無歡喜時九不行布施者惱苦如我等死而往閻魔彼等近食物終於離他去所食無湯汁亦無何福業一此世為餓鬼長久受飢渴惱燒之痛苦成熟苦果業當受激苦果一一財寶富無常此世壽無常無常知無常賢者作庇護一二如是善知者持法受尊敬彼等聞人語不再輕布施一二蛇鬼事一脫去蛇舊皮彼移行新體此體亦不要餓鬼時限來死時亦如是二燒者之不知因緣人悲嘆故我不悲嘆彼已成去者是為彼惡趣三不招而自來不命而自去自來又自去有何可悲者四燒者之不知因緣人悲嘆故我不悲嘆彼已成去者是為彼惡趣五若悲嘆貧陋於此得何果有緣知友人更為我等悲六燒者之不知因緣人悲嘆故我不悲嘆彼已成去者是為彼惡趣七少年追空月行去且哭泣如人將死去悲泣亦如是八燒者之不知因緣人悲嘆故我不悲嘆彼已成去者是為彼惡趣九婆羅門猶如破之水瓶不能再接合如人將死去悲泣亦如是一燒者之不知因緣人悲嘆故我不悲嘆彼已成去者是為彼惡趣第二鬱婆利品一離輪回鬼事一裸體且醜態瘠瘦現血筋唇皮之突出瘦者立此汝為誰二尊者我是餓鬼女住惡趣閻魔羅世界行惡業來此餓鬼之世界三如何身口意以造此惡業如何業應業而入餓鬼界四尊者我無父無母無親無知人告我以誠心布施婆羅門五由此五百年裸身歷諸所為飢渴煩惱此我惡業果六尊者我心尊敬汝賢者汝有大神通同情憐愍我布施何奉事尊者救我出惡趣七善哉答彼女悲深舍利弗施比丘少食掌大之布片八與鉢盂飲物布施為彼女剎那之奉獻立即果應現九衣服與食飲此是布施果彼女著美服上衣迦尸絹諸色之衣服而近舍利弗一汝女美姿容見之有如神又如曉明星輝耀照十方一一緣何有是姿依何有幸福食物為汝生內心有愈快一二我今且問汝女神汝有神通者汝今現為人如何作福業由此汝色輝光輝照十方一三我於惡趣界顏色多蒼瘦裸體又飢渴皮膚成黑皺聖者慈悲於惡趣見我一四施比丘少食掌大之布片飲物一盂鉢汝為我布施一五請見少食果享受一千年我享諸食味快樂甚喜悅一六掌大布片果請看如何耶難陀王王國布匹多如此一七尊者我有更多衣服物絹織與毛織麻織及木綿一八數多價且高此等空中懸隨我心所好任意可穿著一九一盂鉢飲物請看果如何深而有四角技巧築之池二光輝美水濱清泠又好香上覆赤青蓮百合花充滿二一今我無何恐愈悅且享樂尊者感謝慈悲深聖者我今來此世二舍利弗母鬼事一裸體且醜態瘠瘦現血筋唇皮之突出瘦者立此汝為誰二我於前生時為汝之生母生於餓鬼界飢渴受苦惱三棄除之垢物唾痰與鼻汁燃燒身體油或者出産血四又有負傷人剝鼻人之血無論男與女飢迫我所食五動物人膿血我食得生存無住無隱家暗黑住臥榻六我子為我而布施布施回施我如是而為者解脫食膿血七慈悲舍利弗聞母之所言以語目犍連且語阿那律又告劫賓那八共作四小屋施捨四方僧小屋與飲食為母獻布施九剎那現獻果飲食及衣服則為布施果一衣服與飲食此是布施果彼女著美服上衣迦尸絹諸色之衣服而近舍利弗一一汝女美姿容見之有如神又如曉明星輝耀照十方一二緣何有是姿依何有幸福食物為汝生內心有愈快一三我今且問汝女神汝有神通者汝今現為人如何作福業由此汝色輝光輝照十方一四舍利弗布施我喜無恐怖寂靜慈尊者為謝來此處三魔陀鬼事一裸體且醜態瘠瘦現血筋唇皮之突出立此汝為誰二我名為魔陀汝為帝沙女我於前世時為汝之敵婦因為造惡業生此餓鬼界三汝之身口意如何為惡業緣何應業果生此餓鬼世四易怒且橫暴嫉妒又貪欺我常說惡語生入餓鬼世五汝之易暴怒一切我皆知我今更問汝緣何塗污物六汝頭美塗油莊嚴美衣服我與汝比較思為更莊嚴七汝與夫語時我見起激情嫉妒忿怒起八我取污穢物向汝身投注以此應業果我受穢物惱九汝注我污物一切我皆知我今更問汝緣何起疹疥一我與汝二人取藥赴森林汝取醫藥物我取毒果子觸之必害身一一毒果散牀頭毒害汝不知以此業應果我身起疹疥一二汝散毒果實一切我皆知我今更問汝緣何汝裸體一三汝與友相會同為姻親會汝與夫被邀然我未被請一四我取汝著衣此事汝不知以此業應果我今為裸體一五汝取我著物一切我皆知我今更問汝緣何嗅穢味一六香料與花環高貴化粧物我投下水中我作此惡業一七依此業應果我散發穢味依此造惡業一切我皆知一八我今更問汝緣何生惡趣我與汝二人等量有財寶一九我雖有財物不知作庇護依此業應果我今生惡趣二汝所為惡業勿為我再語實緣此惡業汝不在善趣二一汝對我誤解且以起嫉妒請觀汝惡業應果為如何二二汝家有侍女亦有裝身具彼此共享樂享樂非永遠二三亡者汝之父由店來家中或許可施汝汝勿離此處二四我為裸體身醜姿瘦見筋此為女羞處我父不見我二五然我何與汝為汝作何事使汝有幸福更使受得樂二六僧團四比丘更有四餘人饗宴八比丘為我行布施彼時我幸福我受諸快樂二七善哉答彼女饗宴八比丘使著諸衣物為彼行布施二八剎那之奉獻立即果應現衣服與食飲此是布施果二九彼女由此著美服上衣迦尸絹諸色之衣服而近於敵妻三汝女美容姿見之有如神又如曉明星輝耀照十方三一緣何有是姿依何有幸福食物為汝生內心有愈快三二我今且問汝女神汝有神通者汝今現為人如何作福業由此汝色輝光輝照十方三三我名為魔陀汝為帝沙女我於前世時為汝之敵婦因我為惡業生此餓鬼界三四依汝行布施無畏有幸福妹妹得長生一切姻親共三五無憂亦無惱最高勝住所此世行義務布施成美者三六根絶諸貪欲一切無非難汝可到天國四難陀鬼事一汝色黑且醜身污膽怯狀眼赤齒突出不似人之姿二難陀塞那我名為難陀前世為汝妻我因惡口業生於餓鬼界三如何身口意以造此惡業如何業應業而入餓鬼界四我言怒且暴對汝不尊敬我因惡口業生此餓鬼界五我與汝外衣汝著此衣服著衣來此處導引入我家六汝到家中時得衣與飲食得見汝之子得見汝兒媳七汝手與我物對我無有利多聞之比丘具戒無煩惱八飲食使滿足為我行布施彼時我幸福一切得快樂九善哉答彼女為多行布施飲物軟硬食臥具與衣服一香華遮蔽日種種之白檀具戒無煩惱多聞之比丘一一食物與飲物使彼得滿足今為彼女故對彼行布施一二剎那之奉獻立即果應現衣服與食飲此是布施果彼女著美服上衣迦尸絹一三由此諸色之衣服而與夫接近一四汝女美姿容見之有如神又如曉明星輝耀照十方一五緣何有是姿依何有幸福食物為汝生內心有愈快一六我今且問汝女神汝有神通者汝今現為人如何作福業由此汝色輝光輝照十方一七難陀塞那我名為難陀前世為汝妻我因惡口業生於餓鬼界一八依汝行布施無畏有幸福願汝得長生一切姻親共一九無憂亦無惱最高勝住所此世行義務布施成美者二家主行布施根絶諸貪欲一切無非難汝可到天國五耳環女鬼事一著清淨之耳環廣說天宮事經八三六餓鬼事一康哈餓鬼汝起來如何而睡臥睡臥竟何益汝心汝兄弟汝右眼伽達氣狂心迷亂伽沙瓦二伽沙瓦聞羅毗那耶言為兄弟憂惱緊急而起來三何故汝氣狂杜瓦拉迦城徘回市中行口中呼喊兔汝望兔如何四金製摩尼製銀銅及銀製寶石珊瑚製為汝作此兔五或有林森兔我將為汝捉汝欲何種兔六不欲地上兔我欲月中來我望伽沙瓦為我持此來七然而吾弟快捨此生活汝望不可達即歡月中兔八康哈汝賢教他人前已死之子何以汝猶悲九無人可能得非人亦難得生子得不死此事何能得一吠陀之聖言依根本醫術醫藥為無用康哈汝悲此逝者一一持有甚多財以及甚多富國王剎帝利縱然多財富亦非不老死一二剎帝利婆羅門毗舍首陀旃陀羅補羯娑此等及餘者亦非不老死一三持誦吠陀者梵所誦六支此等及他智亦非不老死一四仙人苦行者調御貪等歡一旦死時至彼等捨肉體一五修心一境住成就已義務無漏止惡人亦須捨此體一六如火注酥油燃燒實苦我如以水注者彼消一切苦一七我心懸惱矢彼已善拔除我失子惱苦彼惱已取去一八取除我惱矢我心成寂靜已至無煩惱得聞子之言我已不悲泣一九智慧同情者如是除悲苦如迦達為之長兄二迦達對長兄如是賢言導為彼之輔助亦為一侍者七財護鬼事一裸體且醜姿瘠瘦見血筋唇皮又突出瘦者汝為誰二尊者惡趣閻魔界我住為餓鬼以造諸惡業生此餓鬼界三汝之身口意造何之惡業何業以應果生此餓鬼界四達桑那之國愛拉卡奢有名之城市前世住此處我是大富商被稱護財人此地人皆知五我有八十車巨多之金寶真珠與寶石盡是我所有六有此大財寶我非愛布施乞食不見我閉戶居享樂七貪欲無信仰吝嗇罵他人種種以妨害衆多布施人八布施無應果布施何所得蓮池與水井植樹之庭園水道與架橋悉為我破壞九我不為善業為惡離世去生至餓鬼界飢渴受苦惱離世死以來五十五年餘一我未得食物亦不知飲料吝惜吝物人一切均廢滅凡為廢滅者皆為吝物人餓鬼等實知吝者皆廢滅一一前世我吝物雖有多財寶不以行布施雖有布施物不作庇護所一二故我受業果至今後悔遲四個月之後期限已到來一三我恐生地獄非常之苦極四角有四窗諸屋皆相似鐵壁圍四周頂柵以鐵覆一四鐵地用火燒四側百由旬充滿烈火焰每時皆此狀一五此處長期間我為惡業果不得不受苦是故我悲嘆一六汝等集此處我說幸福言於顯及於冥勿為惡業行一七若既為惡業或將為惡行汝苦不得脫飛去亦難逃一八汝等敬父母家庭敬長者沙門婆羅門皆應得尊敬汝等如是行必生於天國一九若作諸惡業欲入虛空中浸入大深海或於山窟中亦難脫惡業八權商鬼事一汝之裸體瘦汝為禁欲者尊者夜往何處行更有何緣由我等共一切吾謂獻汝財二波羅奈之城廣為世間知前世我富有吝嗇為家主貪求食物欲不以行布施依此惡德故墮入閻魔界三我身飢且疲欲得若干食知人親處行彼等甚慳吝不信他世界布施有善果四我女如是云布施父與祖婆羅門來家以為獻供犧暗陀迦頻陀即往彼處行五國王向彼云汝若受布施速速來我處我深表敬意汝若有根據此應以語我聞而應有信六餓鬼云善哉往去暗陀迦頻陀其處有食物但彼無福受再回王舍城王者前現形七王見餓鬼來問彼何所需應與汝何物與之汝常喜即以告知我八飲食與衣服施與佛僧伽於我有利益使我常歡喜九王由高殿降親手行布施以此施僧事稟告於如來為救此餓鬼而捧此布施一餓鬼受供養非常美光輝再現國王前云我是藥叉最上不思議我不思議力非人所能如一一布施僧團後依彼所顯示非能可計量以觀不思議永恆多滿足人王我幸福九央崛羅鬼事一我等為財寶前往劍蒲闍此藥叉與之我來捉藥叉二同意或強力以捉此藥叉扶住於車上往杜瓦拉迦城三諸人坐樹蔭或得臥其下不可折樹枝此欺友為惡四諸人坐樹蔭或得臥其下若有必要時可得折其幹五諸人坐樹蔭或得臥其下不可撕樹葉此欺友為惡六諸人坐樹蔭或得臥其下若有必要時可得拔其根七滯其家一夜其處得飲食不可興惡意善人知感謝值得使稱讚八滯其家一夜供諸飲食物勿以興害意不可以手害害者即欺友九前善後作惡害人為惡業不得清淨手不得見幸福一若人少邪念清淨無污染對人不害意惡事還及愚如同向逆風投擲微粉塵一一或神或有人或有主權者不為被壓服最高之所持藥叉不思議剎那至遠處持有美色力一二手持黃金色指尖持施物流出蜜美味想汝因陀羅一三我非是天神亦非乾闥婆亦非因陀羅央堀羅麥魯婆城來知我是餓鬼一四如何有戒德於麥魯娑城前世汝為何以此汝梵行由手造出福一五前世於彼城我乃機織女彼時極貧困無可行布施一六我之工作場阿薩伊哈近彼是信仰深而為布施主終生為福業行善恥為惡一七乞者來彼處具有衆多人彼等來問我阿薩伊哈處一八何處與布施我等其處行我被彼所問示阿薩伊哈一九我伸右手指汝等行其處汝有幸福者彼處與布施依此滿願望我手流出蜜我因此梵行我手有福生二實汝依自手未為何布施他人布施喜伸手為教示二一依此滿願望汝手流出蜜汝因此梵行汝手有福生二二尊者施與布施人自手為恭敬捨離此世體又將行何處二三鴦耆羅娑者為所未能為現在與未來我所不能知我近毗沙門阿薩伊哈聞前去伴帝釋二四實應為善業應力行布施見手滿願望誰不為福業二五我今離此處杜瓦拉迦行我將行布施可得此幸福二六我施飲食物寢具與衣服設置給水所難路作橋梁二七爾時另一餓鬼現何故汝指曲何故汝顏歪汝眼突外出汝為何業果二八家主信仰深鴦耆羅沙家我住行布施布施監督者二九乞者來其處我見其求施我行至一隅向彼作歪顏三是故我指曲我顏成歪形雙眼作突出依此惡業果三一汝為輕蔑人顏曲眼突出汝何宜行耶汝於布施他戲作歪顏形三二如何行布施得為他利益我施軟硬食衣服與寢具三三我今離此處杜瓦拉迦行我將行布施可得此幸福三四我施飲食物寢具與衣服設置給水所難路作橋梁三五由此彼歸去再來杜瓦拉鴦堀羅布施彼為幸福者三六彼施飲食物寢具與衣服設置給水所清淨心布施三七準備快馬車運載飢渴人施衣著與人及疲怠者乘三八欲得日傘者香粲及草鞋諸人來此處乞求鴦堀羅理髮料理師乃至賣香者恆常朝夕喚三九鴦堀羅愈快人人皆念我新達伽如何我難睡不見乞食故四鴦堀羅愈快人人皆念我新達伽如何我難睡少有乞食故四一三十三天主帝釋賜與汝一切世界中由汝願所擇四二三十三天主帝釋與我願我願於日出乃我身起時四三出現甘美食現戒德乞士布施永無盡施後我不悔施與心愈悅此願帝釋賜四四汝之諸財産不可過與人汝雖行布施亦應護財寶是故財寶施財寶比施要過於布施時家族不得存四五不過行布施過餘行布施賢者不稱讚是故財産寶勝過於布施賢者辦正法適可而進行四六可也我仍行布施寂靜恭敬人與我行交往如雲滿之降一切乞滿足四七汝見諸乞食顏色有光輝布施我心悅居家有幸福四八汝見諸乞食顏色有光輝布施我心悅成就諸福業四九施前我心樂施時心滿足施後我心悅成就諸福業五一切諸食物六萬台車滿於鴦堀羅家常施諸人人五一三千料理人珠寶著滿身家住鴦堀羅忙於行布施五二六萬青年人珠寶著滿身鴦堀羅大施為彼而劈薪五三婦人萬六千一切為莊嚴鴦堀羅大施為彼作園子五四萬六千婦人一切為莊嚴鴦堀羅大施為彼備湯匙五五彼與多數人長期為施與剎帝利鴦堀羅親手作施與是心善意深反復照顧人五六數月或半月數年或數季鴦堀羅施主長期續大施五七如是長期間鴦堀羅布施捨身離此世彼至三三天五八夜叉因陀迦施與阿那律食物滿鉢皿彼捨此身體到三十三天五九因陀迦有十輝勝鴦堀羅於色及於聲於味香與觸於心常喜悅六壽命與名聲階級與幸福因陀迦於力輝勝鴦堀羅六一鴦堀羅緣汝長久時汝為大施主汝來近前坐汝可來我前六二人間最上者佛在帝釋天晝度樹下坐無垢白石上六三十方之世界諸神齊集來圍繞正覺者停於諸山頂六四諸神於容色無如正覺者勝過一切神唯覺者光輝六五鴦堀羅居處離佛十由旬因陀迦近佛殊勝遍光輝六六佛陀正覺者環顧鴦堀羅以及因陀迦助長布施德佛作如是言六七鴦堀羅汝於長期間多為大布施於我遠離坐汝可來我前六八彼受佛稱讚彼作如是言布施竟何益布施無價值六九藥叉因陀迦僅為少布施如月於星群勝我有光輝七佛告曰如於不毛地雖植多種子無能多得果農夫所不悅七一如對惡戒人多施亦無益大施無大果施主亦不喜七二如於肥沃地少量植種子強量驟雨注得果農夫悅七三具戒有德人如是人有德少量為福業即得大果報七四布施者思惟而後行布施所施有大果思慮而布施施主生天國七五思慮布施價善逝亦稱讚此世行布施所施一切物此世得大果如同植種子播於良田上一鬱多羅母鬼事一日中恆河岸停住一比丘餓鬼女近前姿醜令人懼二彼女髮極長懸垂接地面彼女髮覆面彼對沙門言三五十五年間不知飲食物尊者與我食我渴思飲物四雪山流出水清泠入恆河汝可汲取飲為何乞求我五尊者若我自汲恆河水河水化為血是故我於此向汝乞飲物六汝之身口意如何為惡業依何業應果恆河變成血七尊者我子鬱多羅信深優婆塞彼反我之意四事供沙門八我責鬱多羅我欲打勝彼汝反我心意布施與沙門九衣服與飲食資具及寢具汝於彼世界一切化為血鬱多羅依此業應果恆河變成血一一線餓鬼事一我曾於前世施與比丘線彼來至我家向我乞線去我得多應果著物數千萬二花覆樂宮庭幾重美裝飾男女侍者多財寶多無盡三依此業應果快樂幸福受再來人間界以行諸福業聖弟子導我四汝曾來此處已逾七百年汝年老力衰知己親友死汝由此處去意欲作何為五來此七百年幸福惠如神再來人間界以行諸福業聖弟子導我六彼取彼女手強固捕捉腕如衰弱老婦再得領回歸對來此人言汝等為福業即能得幸福七依我之所見不為善業者將受餓鬼苦多為幸福業人天立福界一二無耳犬鬼事一金色砂之上豎立金色梯此處百合美芳香浸心脾二諸樹覆地面散布種種香紅蓮覆一面池中聚白蓮三香氣蕩心上微風徐吹薰水鳥蒼鷺歌白鵝豎聲鳴四種種百鳥集諸聲歌嘹亮樹有種種實森有種種果五汝所住宮殿多數金銀造人間世界中城市無此貌六壯麗四方輝五百諸侍女此為汝眷屬對汝為侍奉七指環與腕環金色布為飾臥榻金銀造是為汝之物八羚羊鹿皮覆羊毛敷整備彼處汝臥居安然享快樂九時間至中夜汝由此處起出至庭院行圍繞蓮華池一汝於池邊立周圍緑草生美麗無耳犬嚙汝手與足一一嚙盡銷骨時汝已墮池中汝體已復元一二由此汝站立汝為愛美姿汝再著衣服來至我之前一三汝之身口意如何為惡業依何業應果汝為犬所嚙一四金毗羅地方原有一長者本是信仰深彼為優婆塞我乃為彼妻姦婦無戒行如是與人姦夫壻對我云一五汝對我犯罪我不能容許汝為非正行我懼言虛語一六我對汝忠心心體皆無罪若我對於汝心體有罪犯一七以此無耳犬當喰我四肢因此業果報以及此虛言一八苦惱七百年為此無耳犬而嚙我四肢一九然汝多能神為我來此處救我脫犬難無惱亦無恐二尊神我歸命合掌我乞求超人間快樂我與神共享二一超人間快樂我與汝共享汝為幸福者我向汝乞求汝速使我歸歸至波羅奈一三鬱婆利鬼事一般遮羅之國有王名梵施或月日已過王死期已至二配偶鬱婆利荼毗場所行不得再見王以故興悲嘆三仙人來彼處善行之聖者彼於荼毗所會見彼女問四荼毗此場所此為誰之物種種香散布為誰妻悲嘆我夫離我去是故興悲嘆不見梵施王以此我悲嘆五其處之相遇彼女回答言為梵施幸福及汝其他等六此荼毗場所乃是彼所有雲漾種種香我夫離我去是故興悲嘆不見梵施王以此我悲嘆七八萬六千人皆具梵施名於此為荼毗汝為誰悲嘆八秋拉尼之子般遮羅之王尊者彼人我嘆息彼夫與快樂九彼等有諸王皆具梵施名皆為秋拉尼般遮羅大公一一切諸人人順次第一王何故捨前者悲嘆最後人一一長久之期間我身若為妻彼身我輪回多人言彼妻一二汝是為人妻汝為人夫壻亦時為畜生同為有過去不能見極限一三如火注酥油實為苦所燒如以水注火一切苦全消一四汝知我懸心技取煩惱矢汝取我惱苦及失夫煩惱一五除去煩惱矢我心得寂靜如無煩惱苦聖者而今聞汝言我已無悲泣一六彼由此沙門聞此善說言彼取鉢與衣而為出家身一七彼為出家身無家入寂靜為生梵天界善養慈悲心一八由村復至村行腳王城市優樓頻羅村彼女委身住一九為生梵天界善養慈悲心捨離人間欲得生梵天界第三小品一不斷鬼事一恆河水面上繼續來此方離胎為裸體汝如一餓鬼汝著華鬘飾欲往何處行汝將住何處二我為一餓鬼欲往波羅奈近婆娑婆村我今欲往彼三有名之宰相彼名拘利耶我今欲見彼彼將施餓鬼小麥粉食物惑施與美衣四彼於船頭立安置侍浴人直接與浴時見知餓鬼體五著衣飾華鬘惠施與餓鬼依此慈悲心數度施餓鬼六餓鬼覆毛髮身著一片布為欲得食物四面八方去七或赴至遠方行去又歸來飢餓將氣絶徘徊倒地上八地上伏倒者皆為前世業缺乏慈悲心痛苦燃飢火九前世我為惡家婦或家母不為清淨施不作安住地一多持飲食物任其為流失來集出家者些許亦不施一一貪所不應求怠慢不修德少量一摶施貪欲罵受者一二此家諸女僕我之裝飾品其他守護物離我不相伴一三業行竹細工我視為賤業造車者不忠旃陀羅族賤理髮業亦然一四此等下賤人卑賤之種族各各再生於慳貪之歸趣一五前世為善業多作布施行彼等無嫉妒來世生天界耀彼歡喜園一六毗闍延哆宮其中得欲樂生為上種族死為富有身一七重閣之宮殿椅子羊毛覆孔雀羽毛附團扇以持執生為名種族一八此支及他支身著華髮飾朝夕向樂土以念於再生一九無憂唯有樂三十三天之大林歡喜園只容福業者無福不得來二不為福業者此世無有樂彼世亦如是無多為福業者此世即有樂來世彼亦然二一如是望慈悲應多為善業能為福業者天界受快樂二薩努瓦西鬼事一昆帝城長老薩努瓦西住布陀波陀名修習諸善根出家為沙門二父母與兄弟生入閻魔界此世為惡行趣入餓鬼界三彼等生惡趣骨如針之細瘠瘦更裸體恐怖身戰栗如是慘酷相眼目不忍覩四彼之一兄弟獨步行細路手足共爬行出現長老前五長老心遠離精進沉默思餓鬼令彼知前世為兄弟今入餓鬼界而向長老言六父母亦如是尊者乃至二七彼等在惡趣乃至三八我兄施恩惠為我與慈悲由汝之恩惠幸由汝施與悲慘保生命九長老為托鉢他十二比丘托鉢共集來一長老告諸人汝等之所得全部給於我我慈愍親人布施與僧衆一一彼等施長老長老招僧衆如是施與食為父母兄弟而以作回施一二施為親人者親人者幸福剎那食現前一三清淨多甘蜜食得種種味藥味諸食物兄弟有色力如此有幸福一四雖得諸食物尊者請觀察尊者如我之願望與我諸著物一五長老襤褸積中選機織小布片選擇作著物施與四方僧一六施之而長老回施母兄弟為此親人者親人有幸福一七剎那著物現而後著美服彼現長老前一八具多衣幸福於歡喜王國尊者我等更多衣一九諸多美衣服為我懸空中絹織毛織品棉麻高價物我等心所好皆可任選挑尊者如我之願望使我得家住二木葉作小屋施與四方僧施之而長老為父母兄弟以此作回施二一施為親人者親人者幸福剎那住屋現二二家家屋聳立家屋分四角住家立平坦我等之此屋非是世間物二三我等此家屋宛如神仙界煌煌四方輝二四尊者如我之願望使我得飲物長老滿水鉢施與四方僧二五施之而長老回施母兄弟施為親人者親人者幸福二六剎那飲食現甚深而四角善作之蓮地二七清涼置冷水水涼滿清香紅蓮青蓮生亦滿水仙香二八池中浴飲後出現長老前尊者現有多飲物惡業結苦果二九砂石草地上回步跛行者尊者如我之願望願得有乘物三長老有裹靴施與四方僧施之而長老回施母兄弟施為親人者親人有幸福三一在於剎那間餓鬼乘車來食物及著物三二已施家飲食更於施車物今且施慈悲尊者為稱讚牟尼此之慈悲行而來此世界三造車鬼事一具大神力之女神汝煌飾宮殿美輝寶石柱猶如十五日滿月之月坐二容顏輝金色光耀且極美汝坐高貴椅無夫汝一人三蓮池多蓮華金砂之所敷金色水蕩漾不見土緑葉四此亦有白鳥快心並悅目成群水中游鳴聲如天鼓五草美有光輝汝倚船頭立雙眼濃睫毛微笑有愛語手足齊甚美六清淨此天宮立於平等地充滿快樂園歡喜並愈悅汝最上勝者我來歡喜園願與汝共娛七此世為善業並有精進心滿汝快樂願汝將可得我八善哉彼女言彼已為善業善業為彼女生為年少者與彼同住宿四籾殼鬼事一或者食穀殼更食己血肉汝食排泄物不潔又不快此為何業果二前世我殺母又為惡商人我喜食肉食妄語且欺人三我於人間界為人之家婦且為一族主隱慝諸食物如有求乞者何物亦不施且喜作妄語自言非我家隱匿食物故我食排泄物四此業之應果妄語業由二供我好香米化為排泄物五可恥為惡業應果總不失惡臭並有蟲我食排泄物五小兒鬼事一善逝不思議應人而說法有者持多德有者德且寡二小兒捨墳場度夜舔拇指得以保生命藥叉在守護匍匐有動物有德人之子生命得無損犬來舔其足鳥豺皆不害三産時不淨物鳥群為運去目中諸穢物鳥亦為運啄此兒無保護一切皆不設無藥無芥子亦無芳香物四既不為占星亦不為招福不為撒穀物此兒陷苦境夜間之持來捨棄於墓處五顫動如鮮酪身處危險境為其他生命共同所守護人神尊敬彼佛遇見此兒見此而記說六此兒高貴族富有人之子彼如何盡行宗教之義務如何為梵行前生為何業有此業應果雖然蒙此憂彼能享神力七人人對比丘僧團尊佛為上首而承事尊敬此兒之內心對佛有誤解口出粗惡語對佛且無禮八因彼除惡思後得幸福身如來在祗園奉粥七日間九盡宗教義務且又為梵行彼依此善行得此善應果彼因蒙受難然享彼神助一彼於百年間住此人間世滿一切欲望四大且分離生為帝釋子再生來此世六塞利尼鬼事一裸體且醜態瘠瘦現血筋唇皮之突出瘦者立此汝為誰二尊者我是餓鬼女住惡趣閻魔羅世界行惡業來此餓鬼之世界三如何身口意以造此惡業如何業應業而入餓鬼界四遊行外乞錢已有一月餘雖布施為善未曾作庇護五河邊欲解渴河中水消失陰地避暑氣暑氣成焦熱六向我涼風吹吹來如火苦尊者我言汝更有更多苦七往哈斯蒂尼汝告我母親女入閻魔界因其為惡業生入餓鬼世八我往於此處不云有椅子只為顧自己椅實四百千九是故與布施願彼長生命我母行布施回施我獻物於此我幸福以達一切願一善哉答彼女哈斯蒂尼行以語彼女母汝女乃至六之七一一汝女於其處招我乃至六之七前文一二我往於此處不云有椅子以為顧自己椅實四百千一三是故與布施願彼長生命我母行布施回施我獻物於此我幸福以達一切願一四由此我幸福而達一切願彼母實布施而行於布施回施與彼女餓鬼女幸福姿體成美麗七獵鹿鬼事一一汝為一青年天男女所尊夜間享欲樂晝間受惱苦前生行何業二前世王舍城樂住美山窟赤血塗滿手殘酷獵鹿者三殘酷暴虐手人中持惡心常喜害他物行為不自制四我有親切友信深優婆塞彼對我同情屢屢來相勸五不可為惡業以免墮惡趣死後望幸福自制不殺生六我願求幸福與彼具友情雖聞同情言但我未相從不至持正智以長離諸惡七賢明我之友使我入正戒白晝雖殺生夜晚我持戒八晝間為殺業夜間守戒制夜晚受保護白晝來惡趣我為猛犬嚙九依此行業果夜享天界身晝受猛犬攻全身受嚙惱一若汝依正信奉行善逝教歸信常專念完全得不死以達無為境八獵鹿鬼事二一家屋高聳立樓閣純毛被汝坐椅子上享樂聞天樂二然此深夜更當為早晨時被捨於墓處以受種種苦三汝之身口意如何為惡事如何業應果汝得受此苦四前世王舍城樂住美山窟赤血塗滿手獵鹿殘酷者五我有親切友信深優婆塞彼友為比丘瞿曇之聲聞六彼亦乃至七之四一九詐欺鬼事一花環與腕環為汝之裝飾體漾白檀香清淨之顏色輝耀如太陽二諸多非人等為汝作隨從童女有一萬為汝作隨伴三手著金指環身著金色裝汝持大神力容貌人畏敬四自割己背肉己肉自己食如何身口意以作諸惡業如何業應果以喰自背肉五我於生前世自為不利行兩舌與妄語或去為詐欺六或我赴人中應語真實時無視現前法從事非法事七今自喰背肉業者喰自背八那拉陀此是汝所見皆應施慈悲勸人皆稱善勿食己背肉勿作中傷語亦勿為妄語一不敬塔鬼事一汝停在空中腐敗漾惡臭尸蟲齊來集食汝惡臭口二前世為何業刀劍自割胸傷口灑礬鹹再三再四割三如何汝之身以作惡業行如何業果報汝得受此苦四我住王舍城美樂山窟中我為支配者己身持多財五此為前世妻我女與義女我有好香樹樹名達瑪拉我有青蓮華拒不敬佛塔依此惡業果六我等各受苦有八萬六千罵敬佛塔者地獄食穀殼七或供養佛塔而行大祭時以現於惡意彼等各分裂八見人空中來莊嚴持花環受此業應果彼等富幸福九而此不思議見之以驚嘆歸依聖賢人歸命大牟尼一我由此處去我身受人胎供養諸佛塔從此不怠慢第四大品一安拔薩卡拉鬼事一跋耆毗舍離城中離車王安跋薩卡拉於城外見餓鬼其處而問彼二此人無牀座世間所皆無不進亦不退著物飲食物待僕彼皆無三見聞之親友又因之此人無施惠前世彼等不能見此人人所棄四墮入惡趣者不能有親友皆知無食物諸友皆遠離若不墮落者諸友皆來集五食物極缺乏身體污且破如同結露珠今明生命消六如是造惡業殘酷陷不運皮皺曼達杭以是穿其骨汝由何因緣藥叉生命謂重要七此我親友者我回憶前生不持同情念地獄受惡法國王勿使惡行法擴展至地獄八離車王此世已死者此人為惡業七突起地獄苦惱實可怖身處多酷熱可怖而身受九有幾多美德比起地獄苦於此木橛杭不墮此地獄可怕苦難堪一我今說此言衆生受此苦此等諸衆生聞者將捨離若此業現前是故我不語生命之終局我亦無能力一一我解汝之意他事欲相問若得汝許可以問不可怒一二汝與我有約不語不愈快彼此有互信汝云所欲言汝問所欲問汝可對我問一三我以自目見一切為有信見彼我亦信藥叉汝為我助力一四汝與我有約約束為真實汝聞我說法汝心得滿足我等理解善亦有惡心者有願聞法者亦有不聞者一五我語我所知白馬飾我乘杭結汝前去此乘美驚人如何業應果一六毗舍離之城泥土路艱澀我此一香木路進以為橋置難涉地中一七橋停此路上渡我與他人此乘美驚人其業之應果一八其姿十方輝其香十方漾汝具藥叉力持有大神力身為裸體者緣何業應果一九無怒有善心溫和語近人依此業應果姿如神常輝二我見住法者名望我心喜依此業應果如神漾十方二一與友浴淺流來伴於乾地據側其衣服我等興惡念而於與遊戲依此我裸體為不幸運命二二身為遊樂人有此業應果身不為遊樂應得如何果二三身口不淨人四體分裂後無疑趣地獄二四後世思善趣慈悲喜布施四體分裂後無疑生善趣二五善惡業應果我等確應知見何應起信誰為我信者二六善惡業應果見聞應生信善惡兩不存有衆生可往善趣惡趣耶二七於此人間界若無善惡業人無貴賤身衆生往何趣二八無論是何人人間行善惡依此衆生趣善趣或惡趣於人間界者即有貴賤身二九善惡二業果感受樂與苦善能為節制即得樂受果快樂受如神不知二業果愚人受業苦三諸業為自作我不行布施沙門婆羅門我不獻飲食衣服與臥具依此業應果不幸成裸體三一藥叉汝有何方法可以得衣服語我因緣者聞語可信因三二今有一比丘伽比他迦名彼修靜慮者具戒阿羅漢解脫成無漏自利淨諸根其心成靜寂達最上智見三三言辭親切易快語言溫順通達諸經典清淨喜獨居高貴住福田值受人天施三四寂靜諸欲盡無惱無貪欲解脫離執著無邪不利己所有戲論盡智勝達三明三五未知者見彼不知彼之智跋耆人見彼以彼為摩尼彼已盡諸欲知彼我藥叉彼於此世間慈悲行善法三六汝向彼施衣一對或兩對彼若受此衣可見我著衣三七王向何處行可往沙門處我今有疑問對我將去疑三八此人勤精進坐於猿遊境諸神護圍繞說法持正名勇猛極精勤三九如是我等行施衣豫沙門沙門著衣服汝亦得著衣四非時勿近出家者善哉離車王此乃非適法是故適當時其處獨坐見四一彼實如是云而是行彼處僕婢群圍繞離車王近城為過此雨期而入自己家四二彼於適當時家主為義務得時為浴飲衣服選八對離車王者令使僕為齎送四三彼行近其處瞥見一沙門心靜托鉢歸寂然坐樹下四四健康而快適近行居住處彼作如是言我住毗舍離我是離車王閣下人知我安巴薩伽拉四五尊者我來施與汝八對美衣服我以此目的心悅來此處四六汝之居住所遠離諸沙門今見彼住居衣鉢均已破四七人們以斧足蹴落倒沙門如是由汝害達及諸沙門四八汝對布施事一草亦不與對於迷路人從不為指示奪取盲人杖慳邪不自制四九汝今因何故又依何所見欲求於我等為汝作分擔尊者我對汝所云我皆豫承認害沙門婆羅門五我等耽娛樂又曾起惡心尊者如是諸惡行我曾已皆為犯罪我受苦娛樂不完全五一年少幼兒童而作裸體行此為已過苦亦無何意義五二腦裏存不淨常見諸恐怖尊者我今後悔苦以願為布施尊者為此藥叉事受我八對衣五三汝今行布施多人所稱讚依此布施事汝有無盡法我受八對衣為藥叉布施我將施潤澤五四離車王淨口八衣施長老長老受其衣藥叉見著衣五五良香薰良馬美色麗裝飾家僕共圍繞藥叉得神力五六彼見心喜樂彼成幸福貌彼業應大果應果現眼前五七近彼作是言我將布施與沙門婆羅門我無物不與藥叉汝救濟我者五八離車王汝為我布施布施非無益我將為汝友人間與非人五九凡是親友者無論入何趣皆為我之友亦為神伴侶我今合掌禮再為彼等乞藥叉彼等欲見汝六若汝無信心慳吝心有罪雖然得見我不得與我語六一汝若敬愛法專念行布施沙門婆羅門富有於慈悲滿足彼等願汝得見我身六二見此有幸者汝得向彼語速脫此之杭與彼為友人思此結杭因彼此應為友六三速脫此之杭細心行善法彼由地獄出他處受善業六四彼近比丘迦毗達伽隨時分施食彼自由口問彼述其意義六五彼近問比丘有福無惡心聞所未聞法依法為轉述彼言聞法者決定生善趣六六王受知其處與非人交友前往離車處告彼群集言六七諸士杭結慘酷業受罪受罰者請聞我一言切望達目的六八諸位二十日之間日夜受結苦求生不可能求死亦不得今我被得許我隨心所欲六九諸位彼此速解脫誰言成如是如汝所知作彼知如所思七彼來近其處速脫杭結者言友勿恐懼延彼受醫療七一彼等近比丘迦毗達伽隨時分布施近坐離車王國王親口語尋問諸方法七二結杭乃至不死六七六八七三依我以脫苦而彼自行去此為藥叉語尊者以何法彼等脫地獄七四尊者若有可信因原因向汝聞此世業不亡我等業不滅七五若彼行善法晝夜無懈怠得脫彼地獄他處受善業七六知此為人間我願亦受潤尊者教示我賢人決不墮地獄七七今汝歸依佛歸依法與僧汝持信心行不破五學處七八汝速禁殺生遠離不與取勿酒勿妄語己妻為滿足七九近此八支道行此善樂根八僧衣與團食生活必需品臥具及飲食衣服並寢具八一淨意正施與比丘具戒者離貪多聞者滿足己飲食常福以長養八二如是正行業晝夜無懈怠汝將脫地獄他處受善業八三我今歸依佛歸依法與僧我持有信心不破五戒行八四我速離殺生及離不與取不酒不妄語自妻以滿足八五近此八支道以行善樂根僧衣及團食生活必需品臥具並飲食衣服與寢具八六比丘具戒者離貪多聞者我皆為布施不疑信佛教八七如是毗舍離數多優婆塞乃至離車王安扳薩卡拉善心有信仰行宗教義務細心隨僧團八八杭結諸餓鬼離病得自由出家最上之來迦比他迦二達沙門果八九如是從善人必有得大果人人亦皆知杭結第一果安扳薩卡拉亦得下級果二塞里薩伽鬼事天宮事經第七之八四同三難提迦鬼事一蘇喇吒之國王名賓伽羅朝奉孔雀王回返國途中二暑天正日中王行沼澤地王見有好路此是餓鬼道三國王語馭者此地是好道此路無恐怖安全又幸福四國王由此路駛向蘇喇吒四種之軍隊伴王為前進五人人心憂慮臣下對王言惡路易迷惑前途有驚險六前路雖顯現後路則不見王迷惡路中近接閻魔衆七蕩漾非人氣聞聲無慈悲國王心驚懼乃對馭者語八我今迷惡路心實恐又驚路前將可見後路不見得九我迷於惡路近接閻魔衆蕩漾非人氣聞聲無慈悲一乘象眺四方欣見一榕樹延根伸水中樹下有日蔭一一等同黑雲色雲色尖端輝王向馭者語等同黑雲色雲色尖端輝大此何所見一二大王此根延水中而有現日蔭等同黑雲色黑雲為樹輝先輝之雲色亦即此榕樹一三等同黑雲色蘇喇陀見此雲色之光輝由此而出發一四王行乘象群接近大榕樹王臣與家僕均在坐木根一五見水流滿瓶並有軟食物人人如神姿一切著美飾近蘇喇股王以作如是言一六汝大王善來前來近我所征服者飲神之飲料食神之食物一七王與諸臣僕一同進飲食且食又且飲蘇喇陀王曰一八汝實鬼神耶是乾闥婆耶萬能之帝釋不知而問汝我等以如何而得知此耶一九我等既非神亦非乾闥婆非萬能帝釋我等為餓鬼蘇喇陀大王而來此處者二汝於前世時在蘇喇陀國以如何守戒如何為善業如何為梵行依何業應果汝等享此身二一汝等以聞此大王征服者擴國友大臣婆羅門王師二二須拉陀王我等持惡心我等持邪見我等不守戒利己而罵人二三布施善行者我等豫妨礙他人為布施我等豫障害二四無有布施果何有自制果無人可為師不節制誰罰二五有情皆平等何處受最上尊敬之人耶無力無精進何有最上人二六布施無有果不能除敵意應得所得果步入命運途二七無父母兄弟由此無他世無施無供犧不知其效果二八如斷他人頭未作殺人事誰亦無有殺唯置間隙體二九有情之生命無可能被殺如圖八角玉五百由旬長誰有此價值斷絶其生命三如投之絲球隨走而了解如是彼生命亦隨走而已三一如村入他村如是彼生命唯移其他體三二如由家而出以入其他家如是彼生命唯移其他體三三八萬四千劫或愚或賢者輪回而苦已恰似陀那量苦樂滿一箱一切之經驗而移次存在如是之見解而持至前世三四次移彼邪見邪見不持戒利己且惡口六月後之死三五非常苦激恐受生入地獄四角有四窗諸屋相似分三六鐵壁四周圍頂上以鐵覆鐵地燒以火三七四側百由旬充滿烈火焰時時見此狀百千年之間常聞此聲音大王億年為百度十萬倍之間百千億年間邪見不持戒誹謗阿羅漢應受此業苦我於長期間受苦實無限三八為此惡業果是故大悲痛擴國征服者大王汝諦聽我女鬱多羅為汝齎福德三九彼女為善業安住喜戒律寬大持正見親切離貪欲四他門有義妹彼行諸學處彼於釋迦前榮為優婆夷四一具戒比丘尼托鉢來我村舉自能自制入念守諸根沿門托鉢行來至彼住居四二鬱多羅見彼尊者大王為汝齎福德滿水瓶食物布施與彼女四三尊者受我飲死者受恩潤彼言一瞬間果報即現前四四王我於如是思如意得飲食大王擴國征服者大王請諦聽四五佛為最上者為神為人說征服者與汝家族共皆應歸命佛四六依八支聖道可達不死域征服者汝與家族共皆應歸命法四七志於四道者住於四果者僧園正行者慧戒達成者四八征服者汝與家族共歸命於僧園速速離殺生遠離不與取勿酒勿妄語己妻為滿足四九藥叉汝為與惠者汝為我之友天神汝為我之師我將行汝言五我將歸命佛歸命最上法人天之僧團五一我速禁殺生離棄不與取不酒不妄語己妻為滿足五二一切拋捨離速行如疾風遠離諸惡見專念佛說法五三國王如是言遠離諸惡見歸命於佛法進車指東歸四雷瓦提鬼事天宮事經五二同五甘蔗鬼事一此大甘蔗林多生福德果而於我今日不得此物食尊者請告我如何業應果二被害或被切尋求食倣徨我力皆已盡貪困而悲哀此何業應果三有時我被打打棄於地上猶如魚回動痛苦泣淚流如何業應果尊者請告我四疲勞且飢渴身顫心不樂問汝此意義如何得甘蔗五前世汝為人前生已造業我語此意義汝聞應理解六汝去食甘蔗多人隨汝後彼等欲與語汝不交一言七彼等屢要求言與彼甘蔗汝對隨後者甘蔗汝不與依此業應果八汝手握甘蔗眺望汝背後唯食滿所欲汝喜手高揚或者示滿足九彼步汝之後捕捉欲得食唯食之所欲滿足手高舉六兒童鬼事一我聞雪山坡有城名舍衛彼處有二人兒童之王子二王子多放逸盡享肉體樂執著現在樂不作未來想三彼等人間死而趣他世界彼等哭泣說前世所造業四有多人施物我等齎幸福不能自己作五是故何惡業清淨王族死後至餓鬼世以遭飢渴苦六此世支配者其處無支配由高而降低於人間世界倣徨為飢渴七知此王位險王位應捨棄生善趣賢人賢人身壞後身享善趣樂七王兒鬼事一前世造業果而是惱其心色聲香味觸或悅於其心二彼多舞蹈樂遊戲耽享樂尋遊於樂園而入山巴家三彼處有仙人其名須耐陀彼手執持杖寂靜知足恥托鉢喜布施四彼由大象降王子取其鉢尊者汝欲得布施取鉢高舉呼五鉢碎硬地上彼等狂笑去我奇達瓦王子比丘汝其奈我何六手惡業果王子汝作此應受地獄果七六千年之後八萬四千載大苦九萬年有罪受地獄八仰向或倒臥左右之步行兩足行倒立愚人受長苦九數千年之後以至九萬年有罪業之人地獄受大苦一侮辱仙人者有此惡業故加害善人者如是受極苦一一彼處數千年以受此極苦由此而死去生入餓鬼道一二見生於王位如是有危險彼捨王位去住入寂靜處一三見法讚嘆人向佛彼尊敬賢人身壞後善趣得受身八糞食鬼事一一匍匐上糞池汝現居何處汝為何惡業汝有何信仰二尊者我為一餓鬼墮入閻魔界我為惡業故墮入餓鬼趣三汝之身口意如何為惡業依何業應果受此惡業苦四我家比丘居彼心嫉妒深貪我家族利利己多謾罵五我於聞彼言謾罵比丘僧依此業應果生入餓鬼界六仇敵假友誼與汝為伴侶愚人身壞後死後入何趣七我為惡業故住彼頭頂上彼墮於鬼界為我之從者八有幸者他人排泄物以為我食物我之排泄物彼亦賴為生九糞食鬼事二一匍匐上糞池汝現居何處汝為何惡業汝有何信仰二尊者我為一餓鬼墮入閻魔界我為惡業故墮入餓鬼趣三汝之身口意如何為惡業依何業應果受此惡業苦四我家比丘居彼心嫉妒深貪我家族利利己多謾罵五我於聞彼言謾罵比丘僧依此業應果生入餓鬼界六仇敵假友誼與汝為伴侶愚人身壞後死後入何趣七我為惡業故住彼頭頂上彼墮於鬼界為我之從者八有幸者他人排泄物以為我食物我之排泄物他亦賴為生一群集鬼事一裸體醜且瘠筋突見肋骨瘦瘠諸衆人卿等為何故二我等多幸者而今為餓鬼我等墮惡趣住閻魔世界因為造惡業以墮餓鬼界三如何乃至第一二之三四立於閉門前向人乞半錢雖然得施物我無庇護所五口渴近河水河水變空虛我近日蔭處變為暑熱地六熱風如火燃吹來向我等如此惡業值化為我等受七前步數由旬為飢求食物我等寡福者不得終回來八尊者為飢將氣絶倒臥於地上仰向伸手足伏倒顏觸地九倒臥其場者地上為臥處我等寡福者頭胸互相觸一尊者此為惡事值更值他惡業雖然有施物自無庇護所一一我等去此世而得人間胎我等應親切守戒為善業一一華子鬼事一汝已見地獄餓鬼及畜生人與阿修羅天及神世界自見業應果導彼安全行善業行其處二藥叉汝是我之友神忠告者我行汝之言汝為我之師三由我之所見二之一我為少福業一二菴羅鬼事一此汝美蓮池平坦休息所水多花滿開蜂蝶來群集緣何業應果汝得此美物二此汝菴羅林四季結果實花開蜂群集緣何業應果汝得此宮殿三菴羅果實水米汁涼心樂我女行布施我得生此處四自制與節制布施果現前為家族侍女今為家義妹且為支配者五如是不愈快作愈快顏色愛不愛顏色苦為樂顏色以勝於懈怠一三木軸鬼事一彼因為布施得生天上界此為布施果汝等尚布施以行布施者能行過兩界此界彼界布施行兩界汝等應懸念布施勿懈怠一四蓄財鬼事一正法與誤法我得積財富施與他人用得為我分苦一五商子鬼事一期滿六萬年我受地獄苦何時終了日二無終何處終不見有終了卿其處與我皆多為惡故三為惡生活者不作清淨施雖然有施物自無庇護所四今實此處行而以得人胎親切以守戒我多行善業一六六萬槌鬼事一蹣跚氣如狂汝走如鹿奔汝為何惡業汝有何信仰二尊者我為一餓鬼墮入於惡趣住閻魔世界前生為惡業生入餓鬼世三六萬之鐵槌向我頭上落鐵槌落頭上而頭被打碎四如何身口意乃至二一之三五六萬鐵槌落頭上乃至三六須耐陀佛陀聖道修業者清淨具信根莊嚴樹下坐火燒無恐畏七向彼投石塊打挫彼頭上以此業應果我今受此苦八六萬之碎三九為法汝惡者六萬乃至打碎三
